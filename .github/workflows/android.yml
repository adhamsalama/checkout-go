name: Android APK

on:
  push:
    branches: [capacitor-app]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      # Android only installs an update over an existing install if both are signed with the
      # same key; otherwise the app must be uninstalled first, which deletes its data. Each
      # runner generates a fresh debug key, so sign with a fixed one stored as a secret.
      - name: Use stable debug keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 is not set; this APK can't be installed over a previous build without uninstalling (and losing data)."
          fi

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: checkout-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
